<g font-family="Consolas,Menlo,monospace" font-size="14" xml:space="preserve">
<text x="20" y="50" fill="#56d4dd">  ____    _    _____ ____    _    ____</text>
<text x="20" y="70" fill="#56d4dd"> / ___|  / \  | ____/ ___|  / \  |  _ \</text>
<text x="20" y="90" fill="#56d4dd">| |     / _ \ |  _| \___ \ / _ \ | |_) |</text>
<text x="20" y="110" fill="#56d4dd">| |___ / ___ \| |___ ___) / ___ \|  _ &lt;</text>
<text x="20" y="130" fill="#56d4dd"> \____/_/   \_\_____|____/_/   \_\_| \_\</text>
<text x="20" y="150" fill="#56d4dd">  ____ ___ ____  _   _ _____ ____</text>
<text x="20" y="170" fill="#56d4dd"> / ___|_ _|  _ \| | | | ____|  _ \</text>
<text x="20" y="190" fill="#56d4dd">| |    | || |_) | |_| |  _| | |_) |</text>
<text x="20" y="210" fill="#56d4dd">| |___ | ||  __/|  _  | |___|  _ &lt;</text>
<text x="20" y="230" fill="#56d4dd"> \____|___|_|   |_| |_|_____|_| \_\</text>
<text x="20" y="250" fill="#f0c674"></text>
<text x="20" y="270" fill="#c9d1d9">Type &#x27;encode&#x27; to encrypt, type &#x27;decode&#x27; to decrypt:</text>
<text x="20" y="290" fill="#7ee787">encode</text>
<text x="20" y="310" fill="#c9d1d9">Type your message:</text>
<text x="20" y="330" fill="#7ee787">Hello, World!</text>
<text x="20" y="350" fill="#c9d1d9">Type the shift number:</text>
<text x="20" y="370" fill="#7ee787">3</text>
<text x="20" y="390" fill="#f0c674">Here&#x27;s the encoded result: Khoor, Zruog!</text>
<text x="20" y="410" fill="#c9d1d9">Type &#x27;yes&#x27; if you want to go again. Otherwise type &#x27;no&#x27;.</text>
<text x="20" y="430" fill="#7ee787">yes</text>
<text x="20" y="450" fill="#c9d1d9">Type &#x27;encode&#x27; to encrypt, type &#x27;decode&#x27; to decrypt:</text>
<text x="20" y="470" fill="#7ee787">decode</text>
<text x="20" y="490" fill="#c9d1d9">Type your message:</text>
<text x="20" y="510" fill="#7ee787">Khoor, Zruog!</text>
<text x="20" y="530" fill="#c9d1d9">Type the shift number:</text>
<text x="20" y="550" fill="#7ee787">3</text>
<text x="20" y="570" fill="#f0c674">Here&#x27;s the decoded result: Hello, World!</text>
<text x="20" y="590" fill="#c9d1d9">Type &#x27;yes&#x27; if you want to go again. Otherwise type &#x27;no&#x27;.</text>
<text x="20" y="610" fill="#7ee787">no</text>
<text x="20" y="630" fill="#f0c674">Goodbye</text>
